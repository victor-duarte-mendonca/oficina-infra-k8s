name: Terraform

# E2 (spec 06 §6): validate em todo PR/push; plan em PR (comenta o plano); apply por branch
# (homolog -> workspace hml, main -> workspace prod); destroy manual com confirmação.

on:
  push:
    branches: [main, homolog]
  pull_request:
    branches: [main, homolog]
  workflow_dispatch:
    inputs:
      workspace:
        description: "Workspace a destruir"
        type: choice
        options: [hml, prod]
        required: true
      confirm:
        description: 'Digite "destroy-<workspace>" para confirmar (ex.: destroy-hml)'
        type: string
        required: true

permissions:
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.10.5"
  TF_IN_AUTOMATION: "true"
  TF_VAR_allowed_cidr: ${{ secrets.ALLOWED_CIDR }}

jobs:
  validate:
    name: validate
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      # validate roda sem backend; TF_WORKSPACE satisfaz o guard de locals.tf.
      TF_WORKSPACE: hml
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --format compact
      - name: trivy config (IaC scan)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore

  plan:
    name: plan
    if: github.event_name == 'pull_request'
    needs: [validate]
    runs-on: ubuntu-latest
    env:
      # PR para homolog ensaia em hml; PR para main (promoção) planeja prod.
      WORKSPACE: ${{ github.base_ref == 'main' && 'prod' || 'hml' }}
    steps:
      - uses: actions/checkout@v4
      - name: Credenciais da sessão presentes?
        id: creds
        run: echo "present=${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.ALLOWED_CIDR != '' }}" >> "$GITHUB_OUTPUT"
      - name: Sem credenciais/ALLOWED_CIDR — plan não executado
        if: steps.creds.outputs.present != 'true'
        run: echo "::notice::AWS_ACCESS_KEY_ID ou ALLOWED_CIDR ausente; terraform plan requer as credenciais STS da sessão AWS Academy e o ALLOWED_CIDR."
      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.creds.outputs.present == 'true'
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        if: steps.creds.outputs.present == 'true'
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: terraform plan
        if: steps.creds.outputs.present == 'true'
        run: |
          BUCKET="$(bash scripts/bootstrap-state-bucket.sh)"
          terraform init -input=false -backend-config="bucket=${BUCKET}"
          terraform workspace select -or-create "$WORKSPACE"
          terraform plan -input=false -no-color -out=tfplan
          terraform show -no-color tfplan > plan.txt
      - name: Comentar plano no PR
        if: steps.creds.outputs.present == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const max = 60000;
            let plan = fs.readFileSync('plan.txt', 'utf8');
            if (plan.length > max) plan = plan.slice(0, max) + '\n... (plano truncado)';
            const body = `### terraform plan — workspace \`${process.env.WORKSPACE}\`\n\n<details><summary>Plano</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });

  apply:
    name: apply
    if: github.event_name == 'push'
    needs: [validate]
    runs-on: ubuntu-latest
    # homolog -> hml / homologacao ; main -> prod / producao (required reviewer).
    environment: ${{ github.ref_name == 'main' && 'producao' || 'homologacao' }}
    env:
      WORKSPACE: ${{ github.ref_name == 'main' && 'prod' || 'hml' }}
    concurrency:
      group: terraform-state-${{ github.ref_name == 'main' && 'prod' || 'hml' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: terraform apply
        run: |
          BUCKET="$(bash scripts/bootstrap-state-bucket.sh)"
          terraform init -input=false -backend-config="bucket=${BUCKET}"
          terraform workspace select -or-create "$WORKSPACE"
          terraform apply -input=false -auto-approve -no-color
      - name: Resumo
        run: |
          COST=$([ "$WORKSPACE" = "prod" ] && echo "0,049" || echo "0,028")
          {
            echo "### apply concluído — workspace \`$WORKSPACE\`"
            echo ""
            echo "- Aplicação: $(terraform output -raw application_url)"
            echo "- ECR: $(terraform output -raw ecr_repository_url)"
            echo "- Custo estimado enquanto ligado: ~US\$ $COST/h (EC2 + IPv4 + EBS). **Rode o workflow de destroy ao fim da sessão.**"
          } >> "$GITHUB_STEP_SUMMARY"

  destroy:
    name: destroy
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ inputs.workspace == 'prod' && 'producao' || 'homologacao' }}
    env:
      WORKSPACE: ${{ inputs.workspace }}
      CONFIRM: ${{ inputs.confirm }}
    concurrency:
      group: terraform-state-${{ inputs.workspace }}
      cancel-in-progress: false
    steps:
      - name: Confirmação digitada
        run: |
          if [ "$CONFIRM" != "destroy-${WORKSPACE}" ]; then
            echo "::error::Confirmação incorreta. Esperado: destroy-${WORKSPACE}"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: terraform destroy
        run: |
          BUCKET="$(bash scripts/bootstrap-state-bucket.sh)"
          terraform init -input=false -backend-config="bucket=${BUCKET}"
          terraform workspace select "$WORKSPACE"
          terraform destroy -input=false -auto-approve -no-color
      - name: Varredura de órfãos por tag
        run: |
          LEFT=$(aws resourcegroupstaggingapi get-resources \
            --tag-filters "Key=Project,Values=oficina" "Key=Environment,Values=${WORKSPACE}" \
            --query 'ResourceTagMappingList[].ResourceARN' --output text)
          if [ -n "$LEFT" ]; then
            echo "::warning::Recursos ainda com a tag (a API de tags pode atrasar alguns minutos)."
            echo "$LEFT" | tr '\t' '\n'
            echo "### Possíveis órfãos (${WORKSPACE})" >> "$GITHUB_STEP_SUMMARY"
            echo "$LEFT" | tr '\t' '\n' | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Nenhum recurso órfão com Project=oficina, Environment=${WORKSPACE}."
          fi
